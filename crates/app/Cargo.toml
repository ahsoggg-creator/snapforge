[package]
name = "snapforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "SnapForge"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = "0.36.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
snapforge-core = { version = "0.2.0", path = "../core" }
tray-icon = "0.26.1"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_SystemServices", "Win32_System_Memory", "Win32_System_WinRT", "Win32_System_Console"] }
windows-core = "0.62"

[build-dependencies]
embed-resource = "3.0.12"
