name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release
      # Tests that need a real desktop (screen capture, RegisterHotKey, the region overlay with synthesized mouse
      # input). They are verified locally; on a runner they are informational only.
      - name: Live desktop tests
        continue-on-error: true
        timeout-minutes: 10
        run: cargo test --workspace -- --ignored --test-threads=1
