name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Check that the tag matches Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match Cargo.toml version $v" }
      - name: Test, build, package
        shell: pwsh
        run: .\scripts\release.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          gh release create $env:TAG dist\SnapForge-Setup.exe dist\SnapForge.exe dist\snapforge-cli.exe dist\SHA256SUMS.txt --title "SnapForge $version" --notes-file "docs\release-notes\$($env:TAG).md"
