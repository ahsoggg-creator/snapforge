[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ahsoggg-creator/snapforge"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

# Smaller debug builds: dependencies (tract, egui, windows) otherwise produce multi-gigabyte debug databases.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
